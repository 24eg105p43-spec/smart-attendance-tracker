[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Proxy all API requests directly to your live Render backend
[[redirects]]
  from = "/api/*"
  to = "https://smart-attendance-tracker-it1p.onrender.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
